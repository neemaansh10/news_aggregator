[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-aggregator"
version = "1.0.0"
description = "Scalable news ingestion, de-duplication, story clustering and ranking"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "SQLAlchemy[asyncio]>=2.0,<2.1",
    "aiosqlite>=0.19",
    "httpx>=0.26,<1.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
kafka = ["aiokafka>=0.10"]
metrics = ["prometheus-client>=0.19"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "pyflakes>=3.0"]

[project.scripts]
news-aggregator = "newsagg.cli:main"

[tool.setuptools.packages.find]
include = ["newsagg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
